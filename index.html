<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>탐정실록</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="outgame.css">
  <link rel="stylesheet" href="onescreen.css">
  <link rel="stylesheet" href="field.css">
  <style>
    .trial-note { display: block; margin: 0; padding: 8px 16px 12px; text-align: center; background: #2A2622; color: #F6D88A; font: 12px 'Galmuri11', 'Malgun Gothic', sans-serif; } /* at the end of the page, never over content */
    body.field .trial-note { display: none; }
  </style>
  <template id="tpl-home">
  <header class="app-header">
    <a href="#" class="wordmark"><span class="brand-emblem" id="emblem"></span><span>탐정실록<small>FIVE DAYS · ONE TRUTH</small></span></a>
    <div class="head-tools"><span class="pill pill--night" id="caseCount">사건 파일 불러오는 중</span></div>
  </header>
  <main class="workarea home-screen">
    <div class="desk">
      <nav id="folders" class="case-list" aria-label="사건 파일철"><p class="muted">사건 파일을 불러오는 중…</p></nav>
      <div id="caseSheet"></div>
      <div class="drawers" id="homeDrawers">
        <section class="drawer" data-drawer="new">
          <button type="button" class="drawer__head" aria-expanded="false" aria-controls="dw-new"><span class="drawer__title">새 수사</span><span class="drawer__summary" id="newSummary"></span><span class="drawer__arrow" aria-hidden="true">▸</span></button>
          <div class="drawer__body" id="dw-new">
            <form id="createForm" class="stack">
              <label class="field">내 닉네임<input id="createNick" maxlength="12" placeholder="최대 12자" autocomplete="off" required></label>
              <label class="field">수사본부 이름<input id="roomName" maxlength="20" placeholder="닉네임의 수사본부" autocomplete="off"></label>
              <div id="soloBox" class="solo-box" hidden>
                <button id="soloBtn" type="button" class="primary full">혼자 하기</button>
              </div>
              <button class="full" type="submit" id="createBtn" disabled>친구와 함께 · 수사본부 만들기</button>
              <div class="drawers drawers--inner" id="settingsDrawers">
                <section class="drawer" data-drawer="settings">
                  <button type="button" class="drawer__head" aria-expanded="false" aria-controls="dw-settings"><span class="drawer__title">방 설정</span><span class="drawer__summary" id="settingsSummary"></span><span class="drawer__arrow" aria-hidden="true">▸</span></button>
                  <div class="drawer__body" id="dw-settings">
                    <label class="field">정원<select id="roomCapacity"></select></label>
                    <p class="muted small" id="capacityHint" aria-live="polite"></p>
                    <label class="field">난이도<select id="roomDifficulty"><option value="guide">입문 · 할 일과 힌트를 보여 줘요</option><option value="detective">탐정 · 목표를 질문으로만 보여 줘요</option><option value="master">명탐정 · 목표와 힌트 없이</option></select></label>
                    <label class="check"><input id="roomChat" type="checkbox" checked> 팀 채팅 사용</label>
                    <p class="muted small">대기실에서도 다시 바꿀 수 있어요.</p>
                  </div>
                </section>
              </div>
            </form>
          </div>
        </section>
        <section class="drawer" data-drawer="join">
          <button type="button" class="drawer__head" aria-expanded="false" aria-controls="dw-join"><span class="drawer__title">초대 코드로 참가</span><span class="drawer__summary"></span><span class="drawer__arrow" aria-hidden="true">▸</span></button>
          <div class="drawer__body" id="dw-join">
            <form id="joinForm" class="stack">
              <label class="field">초대 코드<input id="joinCode" maxlength="10" placeholder="예: ABC234" autocomplete="off" required></label>
              <div class="join-row">
                <label class="field grow">닉네임<input id="joinNick" maxlength="12" placeholder="최대 12자" autocomplete="off" required></label>
                <button class="primary" type="submit">참가하기</button>
              </div>
            </form>
          </div>
        </section>
        <section class="drawer" data-drawer="recent" id="recentCard" hidden>
          <button type="button" class="drawer__head" aria-expanded="false" aria-controls="dw-recent"><span class="drawer__title">이 브라우저에서 참가한 방</span><span class="drawer__summary" id="recentSummary"></span><span class="drawer__arrow" aria-hidden="true">▸</span></button>
          <div class="drawer__body" id="dw-recent"><ul id="recent" class="rooms"></ul></div>
        </section>
        <section class="drawer" data-drawer="load">
          <button type="button" class="drawer__head" aria-expanded="false" aria-controls="dw-load"><span class="drawer__title">저장 파일로 이어하기</span><span class="drawer__summary"></span><span class="drawer__arrow" aria-hidden="true">▸</span></button>
          <div class="drawer__body" id="dw-load">
            <form id="loadForm" class="stack">
              <label class="field">저장 파일 (.json)<input id="loadFile" type="file" accept=".json,application/json" required></label>
              <div id="loadSummary" class="save-summary" hidden></div>
              <label class="field" id="loadSeatField" hidden>내 자리<select id="loadSeat"></select></label>
              <label class="field">내 닉네임<input id="loadNick" maxlength="12" placeholder="최대 12자" autocomplete="off" required></label>
              <button class="primary" type="submit">새 방으로 이어하기</button>
              <p class="muted small">게임 중 방장이 ‘설정·저장’에서 내려받은 파일이에요. 친구들은 새 초대 코드로 들어와 자기 자리를 골라요.</p>
            </form>
          </div>
        </section>
        <section class="drawer" data-drawer="office">
          <button type="button" class="drawer__head" aria-expanded="false" aria-controls="dw-office"><span class="drawer__title">탐정단 사무실</span><span class="drawer__summary"></span><span class="drawer__arrow" aria-hidden="true">▸</span></button>
          <div class="drawer__body" id="dw-office"><div id="office"></div></div>
        </section>
      </div>
    </div>
  </main>
  <footer class="reference-line"><span>TAMJEONG SILLOK</span><span>함께 발견하고, 함께 추리하는 다섯 날</span></footer>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  </template>
  <template id="tpl-game">
  <div id="join" class="join-screen" hidden></div>
  <div id="app" hidden>
    <header class="app-header">
      <a href="#" class="wordmark" title="처음 화면으로"><span class="brand-emblem" id="emblem"></span><span>탐정실록<small>FIVE DAYS · ONE TRUTH</small></span></a>
      <div class="head-info">
        <span id="roomName" class="tag" title="방 이름"></span>
        <strong id="caseTitle"></strong>
      </div>
      <div class="head-tools">
        <span id="stageBadge" class="stage-badge"></span>
        <span id="timer" class="timer"></span>
        <button id="codeBtn" class="small" title="초대 링크 복사"></button>
        <span id="conn" class="conn">연결 중…</span>
      </div>
    </header>
    <main class="workarea">
      <div id="banner" class="banner" hidden></div>
      <nav id="steps" aria-label="진행 단계"></nav>
      <div class="game-layout">
        <div class="scene-col">
          <section id="stage" class="stage"></section>
          <div id="goal" class="goal"></div>
          <div id="chatBox"></div>
        </div>
        <aside class="side-col">
          <nav id="tabs" class="tabs" aria-label="수첩과 정보"></nav>
          <div id="tabBody" class="tab-body"></div>
        </aside>
      </div>
    </main>
    <footer id="actionbar" class="actionbar"></footer>
  </div>
  <div id="hud" class="nui" hidden></div>
  <div id="touchpad" class="nui touchpad" hidden>
    <div class="pad" role="group" aria-label="이동">
      <button type="button" class="px pad__btn pad__up" data-dir="up" aria-label="위로">▲</button>
      <button type="button" class="px pad__btn pad__left" data-dir="left" aria-label="왼쪽으로">◀</button>
      <button type="button" class="px pad__btn pad__right" data-dir="right" aria-label="오른쪽으로">▶</button>
      <button type="button" class="px pad__btn pad__down" data-dir="down" aria-label="아래로">▼</button>
    </div>
    <button type="button" class="px drop pad__act" id="padAct" aria-label="조사·대화 (E)">E</button>
  </div>
  <div id="shift" class="stage-shift" hidden role="status" aria-live="polite"></div>
  <div id="dialogue" class="nui dialogue-layer" hidden></div>
  <div id="modal" class="modal" hidden><div id="modalCard" class="modal-card" role="dialog" aria-modal="true"></div></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  </template>
  <div class="trial-note">방을 만든 사람의 브라우저가 방을 열어요 · 방장은 게임 동안 방 화면을 열어 두세요 · 진행은 방장 브라우저에 저장돼요</div>
  <script src="cases.js"></script>
  <script src="server-modules.js"></script>
  <script src="runtime.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="p2p.js"></script>
  <script src="shared/patrol.js"></script>
  <script>
    (function () {
      var room = /^#[A-Za-z0-9]{4,10}$/.test(location.hash);
      document.body.className = room ? "game og" : "home og";
      document.body.prepend(document.getElementById(room ? 'tpl-game' : 'tpl-home').content.cloneNode(true));
      var s = document.createElement('script');
      s.type = 'module';
      s.src = room ? 'game.js' : 'home.js';
      document.body.append(s);
      window.addEventListener('hashchange', function () { location.reload(); });
    })();
  </script>
</body>
</html>
